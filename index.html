<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pocket PT</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">My Pocket PT</h1>
      <p class="subtitle">Your personal workout companion</p>
    </header>

    <div class="action-cards">
      <div class="card log-card">
        <div class="card-content">
          <h2>Log Workout</h2>
          <button class="action-button" onclick="window.location.href='log.html'">Add Workout</button>
        </div>
      </div>

      <div class="card history-card">
        <div class="card-content">
          <h2>View Dashboard</h2>
          <button class="action-button" onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
