<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Workout | My Pocket PT</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Log Workout</h1>
      <p class="subtitle">Record your workout details</p>
    </header>

    <div class="navigation">
      <button class="nav-button" onclick="window.location.href='dashboard.html'">View Dashboard</button>
      <button class="nav-button" onclick="window.location.href='index.html'">Back to Home</button>
    </div>

    <form id="workoutForm" class="workout-form">
      <div class="form-group">
        <label for="workoutDate">Date</label>
        <input type="date" id="workoutDate" class="form-control" required />
      </div>

      <div class="form-group">
        <label for="workoutType">Workout Type</label>
        <select id="workoutType" class="form-control" required>
          <option value="">Select workout type</option>
          <option value="push">Push Day</option>
          <option value="pull">Pull Day</option>
          <option value="legs">Leg Day</option>
        </select>
      </div>

      <div id="exerciseList" class="exercise-list-container">
        <h3>Exercises</h3>
        <div class="exercise-list-items">
          <div class="exercise-item">
            <div class="exercise-settings">
              <input type="text" class="exercise-name" placeholder="Exercise name" required />
              <input type="text" class="exercise-reps" placeholder="reps" required />
              <input type="text" class="exercise-weight" placeholder="weight + kgs/lbs" required />
              <input type="text" class="exercise-notes" placeholder="Add notes..." />
              <button type="button" class="remove-exercise">×</button>
            </div>
          </div>
        </div>
        <button type="button" class="add-exercise">Add Exercise</button>
      </div>

      <div class="form-actions">
        <button type="submit" class="action-button">Save Workout</button>
      </div>
    </form>

    <div id="toast" class="toast">
      <div class="toast-content">
        <span class="toast-message">Workout saved</span>
      </div>
    </div>
  </div>

  <script src="log.js"></script>
</body>
</html>
